# Aero-Stadium-2-FR — canonical verified NP3F Splat configuration
# Fragment headers are verified directly from NP3F on-ROM FRAGMENT signatures.
# Internal code boundaries are backed by accepted NP3E↔NP3F anchors or explicit binary verification.

name: Pokemon Stadium 2 (France)
sha1: d7e13535b671024a92822db01507e87bd42f68ec
options:
  basename: pokestadiumgs-fr
  target_path: baseroms/fr/baserom.z64
  ld_script_path: build/np3f/pokestadiumgs-fr.ld
  base_path: .
  compiler: IDO
  find_file_boundaries: False
  header_encoding: ASCII
  platform: n64

  undefined_funcs_auto_path: build/np3f/undefined_funcs_auto.ld
  undefined_syms_auto_path: build/np3f/undefined_syms_auto.ld

  symbol_addrs_path:
    - upstream/pokestadiumgs/linker_scripts/us/symbol_addrs.txt
    - upstream/pokestadiumgs/linker_scripts/us/symbol_addrs_code.txt
    - upstream/pokestadiumgs/linker_scripts/us/symbol_addrs_ultralib.txt

  asm_path: build/np3f/asm
  src_path: build/np3f/src
  asset_path: build/np3f/assets

  build_path: build/np3f
  lib_path: build/np3f/lib
  mips_abi_float_regs: o32

  do_c_func_detection: True
  o_as_suffix: True
  gfx_ucode: f3dex2
  mnemonic_ljust: 12
  rom_address_padding: True
  dump_symbols: True
  generated_c_preamble: |
    #include "global.h"
  asm_inc_header: ""
  use_legacy_include_asm: False
  create_asm_dependencies: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  libultra_symbols: True
  hardware_regs: True
  asm_emit_size_directive: False
  segment_end_before_align: True
  ld_align_section_vram_end: False
  image_type_in_extension: true
  check_consecutive_segment_types: False
