# Aero-Stadium-2-FR — first NP3F static recompilation pass.
# The symbol map is generated locally from Splat --disassemble-all output.

[input]
entrypoint = 0x80000400
symbols_file_path = "../build/np3f/recomp/np3f.syms.toml"
rom_file_path = "../baseroms/fr/baserom.z64"
output_func_path = "../generated/recomp/np3f"
recomp_include = "#include \"recomp.h\"\n#include \"aero_platform.h\""
functions_per_output_file = 50

# set_watch_lohi writes R4300 CP0 WatchLo/WatchHi. Those hardware watchpoint
# registers have no direct role in the Windows host and are not supported by
# the pinned N64Recomp revision. Keep the symbol/call graph, but emit a no-op
# function for the first static recompilation pass.
[patches]
stubs = ["set_watch_lohi"]

# These spin loops wait for the audio thread's counter. The native scheduler
# dispatches external VI messages cooperatively; poll it without changing the
# guest counter, comparison, or audio state.
[[patches.hook]]
func = "func_80035594"
before_vram = 0x80035614
text = "aero_poll_events(rdram);"

[[patches.hook]]
func = "func_80035594"
before_vram = 0x80035660
text = "aero_poll_events(rdram);"

# Image decoding and option saving poll the same task-completion predicate.
# Cooperate only on its not-ready path, preserving the result and state. This
# covers both callers without introducing waits when the task is already done.
[[patches.hook]]
func = "func_8000201C"
before_vram = 0x80002038
text = "if ((int32_t)ctx->r3 <= 0) aero_poll_events(rdram);"

# Follow the game's fragment map while preserving its relocation/BSS logic.
[[patches.hook]]
func = "func_80002440"
text = "aero_map_fragment((uint32_t)ctx->r4, (int32_t)ctx->r5, (uint32_t)ctx->r6);"

[[patches.hook]]
func = "func_8000251C"
text = "aero_unmap_fragment((uint32_t)ctx->r4);"

# Preserve the game's four cartridge checks. Route only their direct PI/ROM
# reads through the host; original comparisons and failure paths still run.
# The corresponding LW is replaced by NOP because the hook supplies its value.
[[patches.hook]]
func = "func_80064CC0"
before_vram = 0x80064CD8
text = "ctx->r15 = (gpr)aero_cartridge_read_u32((uint32_t)ctx->r14 + 0x10);"
[[patches.instruction]]
func = "func_80064CC0"
vram = 0x80064CD8
value = 0
