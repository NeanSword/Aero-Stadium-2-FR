# Aero-Stadium-2-FR — first NP3F static recompilation pass.
# The symbol map is generated locally from Splat --disassemble-all output.

[input]
entrypoint = 0x80000400
symbols_file_path = "../build/np3f/recomp/np3f.syms.toml"
rom_file_path = "../baseroms/fr/baserom.z64"
output_func_path = "../generated/recomp/np3f"
recomp_include = "#include \"recomp.h\""
functions_per_output_file = 50

# set_watch_lohi writes R4300 CP0 WatchLo/WatchHi. Those hardware watchpoint
# registers have no direct role in the Windows host and are not supported by
# the pinned N64Recomp revision. Keep the symbol/call graph, but emit a no-op
# function for the first static recompilation pass.
[patches]
stubs = ["set_watch_lohi"]

# src/unk_220C0.s contains six "bltzal $zero" PC-capture idioms.
# On R4300 these are used only to place PC+8 in $ra while the branch is never
# taken. N64Recomp otherwise treats each encoded branch target as a callable
# static function, including inline literal tables. Replace each idiom with
# an explicit LUI/ORI pair that materializes the same PC+8 value in $ra.
instruction = [
    # func_80064CC0 reads PI_STATUS_REG directly at 0xA4600010.
    # N64ModernRuntime models osPiGetStatus() as 0 (PI idle), so replace the
    # direct MMIO load with "addiu $t7, $zero, 0".
    { func = "func_80064CC0", vram = 0x80064CD8, value = 0x240F0000 },

    { func = "func_80021460", vram = 0x80021470, value = 0x3C1F8002 },
    { func = "func_80021460", vram = 0x80021474, value = 0x37FF1478 },

    { func = "func_80021554", vram = 0x8002157C, value = 0x3C1F8002 },
    { func = "func_80021554", vram = 0x80021580, value = 0x37FF1584 },

    { func = "func_800217D4", vram = 0x80021834, value = 0x3C1F8002 },
    { func = "func_800217D4", vram = 0x80021838, value = 0x37FF183C },

    { func = "func_800217D4", vram = 0x80021858, value = 0x3C1F8002 },
    { func = "func_800217D4", vram = 0x8002185C, value = 0x37FF1860 },

    { func = "func_800217D4", vram = 0x8002187C, value = 0x3C1F8002 },
    { func = "func_800217D4", vram = 0x80021880, value = 0x37FF1884 },

    { func = "func_800217D4", vram = 0x800218A0, value = 0x3C1F8002 },
    { func = "func_800217D4", vram = 0x800218A4, value = 0x37FF18A8 },
]
