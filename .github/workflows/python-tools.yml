name: Validate Python tools

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python modules
        run: python -m compileall -q tools

      - name: Validate JSON configuration
        run: |
          python -m json.tool config/np3f.json >/dev/null
          python -m json.tool config/np3f_fragments.json >/dev/null

      - name: Validate NP3F fragment catalog
        run: python tools/np3f/validate_fragment_catalog.py config/np3f_fragments.json

      - name: Validate NP3F candidate parser
        run: python tools/np3f/validate_candidate_yaml.py tests/fixtures/np3f_candidate.sample.yaml

      - name: Validate full NP3F Splat map
        run: python tools/np3f/validate_candidate_yaml.py yamls/fr/splat.yaml

      - name: Validate Splat hint parser
        run: |
          python tools/np3f/extract_splat_hints.py --log tests/fixtures/np3f_splat_hints.sample.log --output /tmp/np3f_splat_hints.json
          python -m json.tool /tmp/np3f_splat_hints.json >/dev/null
          python -c "import json; d=json.load(open('/tmp/np3f_splat_hints.json')); assert d['summary']['fragment_rodata_candidates'] == 1; assert d['summary']['text_rodata_ownership_hints'] == 1"

      - name: Validate ROM verifier syntax
        run: python -m py_compile tools/verify_np3f_rom.py
